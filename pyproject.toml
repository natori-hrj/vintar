[project]
name = "vintar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "natori", email = "natori.rj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
vintar = "vintar.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
