[project]
name = "vintar"
version = "0.1.0"
description = "Run authorized web security regression checks in CI with JSON reports and exit codes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "natori", email = "natori.rj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.5,<51.0.0",
    "httpx>=0.28.1",
    "pyyaml==6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
vintar = "vintar.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "RUF", "TID", "RUF100", "BLE001"]

[tool.pytest.ini_options]
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["src/vintar"]
concurrency = ["multiprocessing"]
parallel = true
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
fail_under = 89
precision = 2

[tool.importlinter]
root_package = "vintar"

[[tool.importlinter.contracts]]
name = "Core must stay independent of orchestration and CLI. Put shared primitives in core."
type = "forbidden"
source_modules = ["vintar.core"]
forbidden_modules = [
    "vintar.checks", "vintar.regression", "vintar.cli",
    "vintar.sqli_cli", "vintar.regression_cli",
]

[[tool.importlinter.contracts]]
name = "Checks must stay independent of batch orchestration and CLI. Pass inputs through check APIs."
type = "forbidden"
source_modules = ["vintar.checks"]
forbidden_modules = [
    "vintar.regression", "vintar.cli", "vintar.sqli_cli", "vintar.regression_cli",
]

[[tool.importlinter.contracts]]
name = "Regression must stay independent of CLI. Pass runtime settings through regression APIs."
type = "forbidden"
source_modules = ["vintar.regression"]
forbidden_modules = ["vintar.cli", "vintar.sqli_cli", "vintar.regression_cli"]

[[tool.importlinter.contracts]]
name = "Direct core.http access bypasses scope, request budgets, and rate limits. Use vintar.core.executor.ExecutionContext."
type = "forbidden"
source_modules = ["vintar.checks"]
forbidden_modules = ["vintar.core.http"]
allow_indirect_imports = true

[dependency-groups]
dev = [
    "coverage==7.17.3",
    "cyclonedx-python-lib[validation]>=11.12.0,<12",
    "fastapi>=0.162.5",
    "import-linter>=2.16",
    "jsonschema>=4.25.1",
    "mypy==2.4.1",
    "packaging>=26.3",
    "pip-audit==2.10.1",
    "psycopg[binary]>=3.3.9",
    "pymysql>=1.2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "twine==7.0.0",
    "types-pyyaml==6.0.12.20261113",
    "uvicorn>=0.54.0",
]
