name: Vintar Dependency Audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Audit locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Audit runtime and development dependencies
        shell: bash
        run: |
          requirements="$(mktemp)"
          trap 'rm -f "$requirements"' EXIT
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$requirements" > /dev/null
          uv run --locked --python 3.13 pip-audit --strict --require-hashes --disable-pip --requirement "$requirements"
