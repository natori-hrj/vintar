
name: Vintar Security Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vintar-security-testing
  cancel-in-progress: false

jobs:
  validate-ref:
    name: Require the protected main branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject non-main dispatches
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Vintar: only the protected main branch may be verified." >&2
            exit 2
          fi

  verify:
    name: Authorized security verification
    needs: validate-ref

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment:
      name: security-testing

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Vintar and validate report
        env:
          VINTAR_TARGET_ORIGIN: ${{ vars.VINTAR_TARGET_ORIGIN }}
          VINTAR_ALLOWED_ORIGIN: ${{ vars.VINTAR_ALLOWED_ORIGIN }}
        run: |
          set -euo pipefail
          umask 077

          report_dir="$RUNNER_TEMP/vintar-report"
          mkdir -m 700 -- "$report_dir"
          temporary_report="$(mktemp "$report_dir/.report.XXXXXX")"
          trap 'rm -f "$temporary_report"' EXIT

          # Preserve the security-gate result without emitting JSON
          # or environment values into the workflow log.
          set +e
          uv run --locked vintar verify \
            --cases ./security/cases \
            --max-requests 48 \
            --rps 2.0 \
            --timeout 10.0 \
            --authorized \
            > "$temporary_report" 2>/dev/null
          vintar_exit=$?
          set -e

          # The report must match both JSON Schema and CLI exit code.
          # Invalid or absent reports become ERROR=2.
          if ! uv run --locked python \
            scripts/validate_ci_report.py \
            "$temporary_report" \
            "$vintar_exit"; then
            echo "Vintar: no valid CI report was produced." >&2
            exit 2
          fi

          mv -- "$temporary_report" "$report_dir/vintar-report.json"

          case "$vintar_exit" in
            0)
              echo "Vintar: verification completed."
              ;;
            1)
              echo "Vintar: security gate failed." >&2
              ;;
            3)
              echo "Vintar: verification inconclusive." >&2
              ;;
          esac

          exit "$vintar_exit"

      - name: Upload Vintar report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vintar-security-report
          path: ${{ runner.temp }}/vintar-report/vintar-report.json
          if-no-files-found: ignore
          retention-days: 7
