name: Vintar Release Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Selected ref quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for committed secrets
        run: python3 scripts/scan_git_history.py

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Check import contracts
        run: uv run lint-imports

      - name: Check HTTP architecture
        run: uv run python scripts/check_architecture.py

      - name: Check Python types
        run: uv run --locked mypy --strict src/vintar

      - name: Run pytest with branch coverage
        run: |
          set -euo pipefail
          coverage_dir="$(mktemp -d "${RUNNER_TEMP}/vintar-coverage.XXXXXX")"
          export COVERAGE_FILE="$coverage_dir/.coverage"
          uv run --locked coverage run -m pytest
          uv run --locked coverage combine
          uv run --locked coverage report --show-missing

  rehearse:
    name: Verify release distributions on supported CPython versions
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build and verify one distribution set
        run: >-
          uv run --locked python -m scripts.rehearse_release
          --output "$RUNNER_TEMP/vintar-release"

      - name: Upload verified distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vintar-verified-release
          path: |
            ${{ runner.temp }}/vintar-release/*.whl
            ${{ runner.temp }}/vintar-release/*.tar.gz
            ${{ runner.temp }}/vintar-release/SHA256SUMS
            ${{ runner.temp }}/vintar-release/sbom-cpython-*.cdx.json
          if-no-files-found: error
