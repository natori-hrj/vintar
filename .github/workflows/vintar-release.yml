name: Vintar Release

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  quality:
    name: Selected ref quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Scan for committed secrets
        run: python3 scripts/scan_git_history.py

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Check import contracts
        run: uv run lint-imports

      - name: Check HTTP architecture
        run: uv run python scripts/check_architecture.py

      - name: Check Python types
        run: uv run --locked mypy --strict src/vintar

      - name: Run pytest with branch coverage
        run: |
          set -euo pipefail
          coverage_dir="$(mktemp -d "${RUNNER_TEMP}/vintar-coverage.XXXXXX")"
          export COVERAGE_FILE="$coverage_dir/.coverage"
          uv run --locked coverage run -m pytest
          uv run --locked coverage combine
          uv run --locked coverage report --show-missing

  rehearse:
    name: Verify release distributions on supported CPython versions
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.verified.outputs.artifact-id }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build and verify one distribution set
        run: |
          set -euo pipefail
          args=(--output "$RUNNER_TEMP/vintar-release")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          uv run --locked python -m scripts.rehearse_release "${args[@]}"

      - name: Upload verified distribution artifacts
        id: verified
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vintar-verified-release
          path: |
            ${{ runner.temp }}/vintar-release/*.whl
            ${{ runner.temp }}/vintar-release/*.tar.gz
            ${{ runner.temp }}/vintar-release/SHA256SUMS
            ${{ runner.temp }}/vintar-release/sbom-cpython-*.cdx.json
          if-no-files-found: error

  publish-pypi:
    name: Publish verified distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: rehearse
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rehearse.outputs.artifact-id }}
          path: ${{ runner.temp }}/vintar-release

      - name: Verify hashes and stage missing distributions
        id: pypi-files
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/vintar-release"
          (cd "$artifact" && sha256sum --check --strict SHA256SUMS)
          python3 scripts/prepare_release_publish.py stage-pypi "$artifact" "$GITHUB_WORKSPACE/dist" >> "$GITHUB_OUTPUT"

      - name: Confirm release tag still points at the verified commit
        if: steps.pypi-files.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_release_publish.py check-tag

      - name: Publish to PyPI with Trusted Publishing
        if: steps.pypi-files.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [rehearse, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.rehearse.outputs.artifact-id }}
          path: ${{ runner.temp }}/vintar-release

      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/vintar-release"
          (cd "$artifact" && sha256sum --check --strict SHA256SUMS)
          python3 scripts/prepare_release_publish.py check-tag
          gh release create --verify-tag --target "$GITHUB_SHA" --generate-notes --title "$GITHUB_REF_NAME" -- \
            "$GITHUB_REF_NAME" "$artifact"/*.whl "$artifact"/*.tar.gz "$artifact/SHA256SUMS" "$artifact"/sbom-cpython-*.cdx.json
