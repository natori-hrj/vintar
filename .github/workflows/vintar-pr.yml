
name: Vintar PR Loopback E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: vintar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Vintar PR Lint and Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run ruff check

      - name: Check Ruff formatting
        run: uv run ruff format --check

      - name: Check import contracts
        run: uv run lint-imports

      - name: Check HTTP architecture
        run: uv run python scripts/check_architecture.py

      - name: Run pytest
        run: uv run pytest

  loopback-e2e:
    name: Vintar PR Loopback E2E
    needs: lint-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: false
          github-token: ""

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Vintar loopback E2E
        run: |
          set -euo pipefail
          uv run --locked python -m scripts.run_ci_e2e

      - name: Verify E2E reports
        run: |
          set -euo pipefail

          report_dir="$RUNNER_TEMP/vintar-e2e-reports"

          shopt -s nullglob
          reports=("$report_dir"/*.json)

          test "${#reports[@]}" -eq 3
          test -f "$report_dir/pass.json"
          test ! -L "$report_dir/pass.json"
          test -f "$report_dir/fail.json"
          test ! -L "$report_dir/fail.json"
          test -f "$report_dir/inconclusive.json"
          test ! -L "$report_dir/inconclusive.json"
          test ! -e "$report_dir/error.json"

          uv run --locked python scripts/validate_ci_report.py \
            "$report_dir/pass.json" 0
          uv run --locked python scripts/validate_ci_report.py \
            "$report_dir/fail.json" 1
          uv run --locked python scripts/validate_ci_report.py \
            "$report_dir/inconclusive.json" 3

          echo "Vintar PR loopback E2E contract verified."

      - name: Upload verification reports
        # Fork PR code is untrusted and must not publish arbitrary artifacts.
        if: >-
          success() &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vintar-pr-loopback-e2e-reports-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/vintar-e2e-reports/pass.json
            ${{ runner.temp }}/vintar-e2e-reports/fail.json
            ${{ runner.temp }}/vintar-e2e-reports/inconclusive.json
          if-no-files-found: error
          retention-days: 1
