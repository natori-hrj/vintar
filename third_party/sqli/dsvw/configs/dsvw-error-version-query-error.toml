# This uses the same pre-measurement payload as dsvw-error-id where v is only
# reflected and never reaches a SQL sink.
config_version = 1
type = "sqli.error"
input_id = "input-ffe5bfa38242d9cad17138d92bb38efd"

[target]
url = "__ORIGIN__/"
allowed_origin = "__ORIGIN__"

[injection]
location = "query"
name = "v"
occurrence = 0
mode = "append"

[probes]
selection = "explicit"
error_payload = "'"

[limits]
max_requests = 4
requests_per_second = 10.0
timeout_seconds = 5.0
