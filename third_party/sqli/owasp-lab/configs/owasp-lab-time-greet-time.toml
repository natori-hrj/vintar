# The reflected-only negative uses the same pre-measurement PostgreSQL payload relation.
config_version = 1
type = "sqli.time"
input_id = "input-b714f64e50b1e26b75d7ac44596d3b74"

[target]
url = "__ORIGIN__/a03/greet"
allowed_origin = "__ORIGIN__"

[injection]
location = "query"
name = "name"
occurrence = 0
mode = "append"

[probes]
selection = "explicit"
delay_payload = "' OR (SELECT 1 FROM pg_sleep(0.5))=1-- "
control_payload = "' OR (SELECT 1 FROM pg_sleep(0))=1-- "
expected_delay_seconds = 0.5

[limits]
max_requests = 9
requests_per_second = 10.0
timeout_seconds = 5.0
